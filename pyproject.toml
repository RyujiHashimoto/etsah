[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prout-lang"
version = "0.1.0"
description = "PROUT contract language, with an MCP checker and guard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryuji Hashimoto (J-PROUT Inc.)" }]
dependencies = []

[project.scripts]
prout = "prout:main"
prout-mcp = "prout_mcp.server:main"

[tool.setuptools]
py-modules = ["prout", "prout_api", "prout_import", "render"]
packages = ["prout_mcp"]
