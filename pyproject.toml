[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prout-lang"
version = "0.1.0"
description = "Etsah: contracts for AI agents. Declare effects and approvals, catch unsafe automations before they run."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryuji Hashimoto (J-PROUT Inc.)" }]
keywords = ["etsah", "ai-agents", "contracts", "effects", "static-analysis", "mcp", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RyujiHashimoto/prout-lang"
Repository = "https://github.com/RyujiHashimoto/prout-lang"
Changelog = "https://github.com/RyujiHashimoto/prout-lang/blob/main/CHANGELOG.md"

[project.scripts]
etsah = "etsah:main"
etsahc = "etsah_patterns.etsahc:main"
etsah-mcp = "etsah_mcp.server:main"
prout = "prout:main"
proutc = "prout_patterns.proutc:main"
prout-mcp = "prout_mcp.server:main"

[tool.setuptools]
py-modules = ["etsah", "etsah_api", "etsah_import", "prout", "prout_api", "prout_import", "render"]
packages = ["etsah_patterns", "etsah_mcp", "prout_patterns", "prout_mcp"]

[tool.setuptools.package-dir]
etsah_patterns = "patterns"

[tool.setuptools.package-data]
etsah_patterns = [
    "registry/*.json",
    "examples/*.etsah",
    "bench/*.etsah",
    "bench/*.json",
]
