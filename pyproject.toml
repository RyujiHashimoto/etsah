[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prout-lang"
version = "0.1.0"
description = "Contracts for AI agents: declare effects and approvals, catch unsafe automations before they run."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryuji Hashimoto (J-PROUT Inc.)" }]
keywords = ["ai-agents", "contracts", "effects", "static-analysis", "mcp", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RyujiHashimoto/prout-lang"
Repository = "https://github.com/RyujiHashimoto/prout-lang"
Changelog = "https://github.com/RyujiHashimoto/prout-lang/blob/main/CHANGELOG.md"

[project.scripts]
prout = "prout:main"
proutc = "prout_patterns.proutc:main"
prout-mcp = "prout_mcp.server:main"

[tool.setuptools]
py-modules = ["prout", "prout_api", "prout_import", "render"]
packages = ["prout_patterns", "prout_mcp"]

[tool.setuptools.package-dir]
prout_patterns = "patterns"

[tool.setuptools.package-data]
prout_patterns = [
    "registry/*.json",
    "examples/*.prout",
    "bench/*.prout",
    "bench/*.json",
]
