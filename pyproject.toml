[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prout-lang"
version = "0.1.0"
description = "Etsah: contracts for AI agents. Declare effects and approvals, catch unsafe automations before they run."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryuji Hashimoto (J-PROUT Inc.)" }]
keywords = ["etsah", "ai-agents", "contracts", "effects", "static-analysis", "mcp", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RyujiHashimoto/etsah"
Repository = "https://github.com/RyujiHashimoto/etsah"
Changelog = "https://github.com/RyujiHashimoto/etsah/blob/main/CHANGELOG.md"

[project.scripts]
etsah = "etsah:main"
etsahc = "etsah_patterns.etsahc:main"
etsah-mcp = "etsah_mcp.server:main"
prout = "prout:main"
proutc = "prout_patterns.proutc:main"
prout-mcp = "prout_mcp.server:main"

[tool.setuptools]
py-modules = ["etsah", "etsah_api", "etsah_import", "prout", "prout_api", "prout_import", "render"]
# registry, examples, and bench hold data, not Python modules. They are
# listed so setuptools ships those directories with the package. A data
# directory that is not listed is treated as an undeclared package and
# can be left out of the install.
packages = [
    "etsah_patterns",
    "etsah_patterns.registry",
    "etsah_patterns.examples",
    "etsah_patterns.bench",
    "etsah_mcp",
    "prout_patterns",
    "prout_mcp",
]

[tool.setuptools.package-dir]
etsah_patterns = "patterns"

[tool.setuptools.package-data]
etsah_patterns = [
    "registry/*.json",
    "examples/*.etsah",
    "bench/*.etsah",
    "bench/*.json",
]
"etsah_patterns.registry" = ["*.json"]
"etsah_patterns.examples" = ["*.etsah"]
"etsah_patterns.bench" = ["*.etsah", "*.json"]
